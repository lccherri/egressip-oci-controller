---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egressip-oci-controller
  namespace: egressip-oci
---
# Cluster-wide read access: EgressIPs (desired state) and Nodes (IP -> VNIC).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egressip-oci-controller
rules:
  - apiGroups: ["k8s.ovn.org"]
    resources: ["egressips"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Events on EgressIP objects (OCIPrivateIPCreated/Moved, OCIAddressConflict)
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egressip-oci-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egressip-oci-controller
subjects:
  - kind: ServiceAccount
    name: egressip-oci-controller
    namespace: egressip-oci
---
# Namespace scope: fencing ConfigMap and leader election Lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egressip-oci-controller
  namespace: egressip-oci
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egressip-oci-controller
  namespace: egressip-oci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egressip-oci-controller
subjects:
  - kind: ServiceAccount
    name: egressip-oci-controller
    namespace: egressip-oci
