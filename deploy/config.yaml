---
apiVersion: v1
kind: Namespace
metadata:
  name: egressip-oci
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-integration-config
  namespace: egressip-oci
data:
  SUBNET_OCIDS: "ocid1.subnet.oc1..CHANGEME"
  CLUSTER_ID: "cluster-a"
  RESYNC: "60s"
  OCI_AUTH: "api_key"           # or instance_principal
  OCI_CONFIG_FILE: "/etc/oci/config"
  
  # DRCC regions are not known to the OCI SDK; set exactly one of the
  # options below (see README, DRCC configuration). The values come
  # from the instance metadata service:
  #   curl -H "Authorization: Bearer Oracle" http://169.254.169
  # In commercial OCI regions, remove OCI_SERVICE_ENDPOINT.
  
  # Option 1: Networking endpoint, https://iaas.<regionIdentifier>.<realmDomainComponent>
  OCI_SERVICE_ENDPOINT: "https://iaas.CHANGEME"
  
  # Option 2: region metadata (the regionInfo output); region in the
  # OCI config must match regionIdentifier or regionKey.
  # OCI_REGION_METADATA: '{"realmKey":"CHANGEME","realmDomainComponent":"CHANGEME","regionKey":"CHANGEME","regionIdentifier":"CHANGEME"}'
  
  # Option 3: realm domain only; region in the OCI config must be regionIdentifier.
  # OCI_DEFAULT_REALM: "CHANGEME"
  
  # The OCI SDK honors the standard proxy variables. OpenShift does not
  # inject the cluster-wide proxy into workloads, so set them if needed.
  # HTTPS_PROXY: "http://example.com"
  # NO_PROXY: ".cluster.local,.svc,172.30.0.1"
  
  DRY_RUN: "true"              # review the logs before disabling
---
# DR fencing: only the cluster with active=true changes private IPs in OCI.
# A missing ConfigMap means inactive (fail-safe).
apiVersion: v1
kind: ConfigMap
metadata:
  name: egressip-oci-active
  namespace: egressip-oci
data:
  active: "true"
---
# OpenShift injects the cluster trusted CA bundle here (proxy trustedCA plus
# system CAs). Required when the DRCC endpoints use a private CA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trusted-ca
  namespace: egressip-oci
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
---
# OCI credentials (api_key) for a dedicated service user whose policy is
# limited to the node compartment. In production, deliver this Secret through
# External Secrets Operator or Vault instead of keeping it in Git.
apiVersion: v1
kind: Secret
metadata:
  name: oci-credentials
  namespace: egressip-oci
type: Opaque
stringData:
  config: |
    [DEFAULT]
    user=ocid1.user.oc1..CHANGEME
    fingerprint=aa:bb:cc:CHANGEME
    tenancy=ocid1.tenancy.oc1..CHANGEME
    region=CHANGEME
    key_file=/etc/oci/key.pem
  key.pem: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME
    -----END PRIVATE KEY-----
